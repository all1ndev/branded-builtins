name: test

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        strategy:
            matrix:
                node: [22, 24, 26]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm test

    # The brands' path claims also need to hold on real Windows paths.
    runtime-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - run: node test/runtime.mjs
